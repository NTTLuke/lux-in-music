[project]
name = "lux-in-music"
version = "0.1.0"
description = "Local generative music studio using models compatible with audio.cpp"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "numpy>=2.4.6",
    "soxr>=1.1.0",
]

[project.scripts]
studio-gen = "studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]
