[project]
name = "lux-in-music"
version = "0.3.1"
description = "Local generative music studio using models compatible with audio.cpp"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "numpy>=2.4.6",
    "soxr>=1.1.0",
    "soundfile>=0.14.0",
    "packaging>=24",
]

[project.optional-dependencies]
vibe = [
    "sentence-transformers[image]>=6.1,<7",
    "transformers>=4.57,<6",
    "torch>=2.7,<3",
    "huggingface-hub>=0.30,<2",
    "Pillow>=11",
]

[project.scripts]
studio-gen = "studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.hatch.build.targets.wheel.force-include]
"studio/data/vibe-style-catalog.json" = "studio/data/vibe-style-catalog.json"
