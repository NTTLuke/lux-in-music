name: Repository checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run portable contributor harness
        run: python scripts/check.py
      - name: Install locked application dependencies (no models)
        run: |
          python -m pip install uv==0.10.10
          uv sync --frozen --python 3.12
      - name: Run offline application acceptance tests
        run: .venv/bin/python scripts/check.py --full
